{% extends "base.html" %}

{% block title %}Register - ParkSmart Fluid{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-5">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="glass-card p-4 p-md-5 glass-card-hover">
            <div class="text-center mb-4">
                <div class="bg-info bg-opacity-20 d-inline-flex p-3 rounded-circle text-info mb-3 border border-info border-opacity-25 shadow-sm">
                    <i class="fa-solid fa-user-plus fs-1 text-info"></i>
                </div>
                <h3 class="fw-bold mb-1">Create Account</h3>
                <p class="text-muted small">Register to book and manage parking lots</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-body border-secondary border-opacity-25 text-muted"><i class="fa-solid fa-user"></i></span>
                        <input type="text" name="username" class="form-control bg-body border-secondary border-opacity-25 text-main" placeholder="Choose a username" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-body border-secondary border-opacity-25 text-muted"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" name="email" class="form-control bg-body border-secondary border-opacity-25 text-main" placeholder="user@example.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-body border-secondary border-opacity-25 text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" class="form-control bg-body border-secondary border-opacity-25 text-main" placeholder="Create a strong password" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Account Role</label>
                    <select name="role" class="form-select bg-body border-secondary border-opacity-25 text-main">
                        <option value="user" selected>Standard User (Park Vehicles)</option>
                        <option value="admin">Admin (Manage Parking Lots)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-gradient-primary water-ripple w-100 py-3 mb-3 fw-bold">
                    <i class="fa-solid fa-user-check me-2"></i> Register Account
                </button>
            </form>

            <div class="text-center text-muted small mt-3">
                Already registered? <a href="{{ url_for('login') }}" class="text-info text-decoration-none fw-semibold">Log in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
