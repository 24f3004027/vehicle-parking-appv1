{% extends "base.html" %}

{% block title %}Edit Parking Lot - ParkSmart{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5">
            <div class="mb-4">
                <a href="{{ url_for('admin_dashboard') }}" class="text-secondary text-decoration-none small">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
                </a>
                <h3 class="fw-bold text-white mt-2 mb-1"><i class="fa-solid fa-pen-to-square text-warning me-2"></i>Edit Parking Lot</h3>
                <p class="text-secondary small">Update information for {{ lot.name }}</p>
            </div>

            <form method="POST" action="{{ url_for('edit_lot', lot_id=lot.id) }}">
                <div class="mb-3">
                    <label class="form-label text-light small fw-semibold">Parking Lot Name</label>
                    <input type="text" name="name" value="{{ lot.name }}" class="form-control bg-dark text-white border-secondary" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-light small fw-semibold">Location / Address</label>
                    <input type="text" name="address" value="{{ lot.address }}" class="form-control bg-dark text-white border-secondary" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label text-light small fw-semibold">PIN Code</label>
                        <input type="text" name="pin_code" value="{{ lot.pin_code }}" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label text-light small fw-semibold">Hourly Rate (₹)</label>
                        <input type="number" step="0.5" name="price_per_hour" value="{{ lot.price_per_hour }}" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold">
                    <i class="fa-solid fa-save me-2"></i> Save Changes
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
