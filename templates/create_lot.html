{% extends "base.html" %}

{% block title %}Add Parking Lot - ParkSmart{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5">
            <div class="mb-4">
                <a href="{{ url_for('admin_dashboard') }}" class="text-secondary text-decoration-none small">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
                </a>
                <h3 class="fw-bold text-white mt-2 mb-1"><i class="fa-solid fa-square-plus text-primary me-2"></i>Add New Parking Lot</h3>
                <p class="text-secondary small">Set location details, spot capacity, and hourly rate</p>
            </div>

            <form method="POST" action="{{ url_for('create_lot') }}">
                <div class="mb-3">
                    <label class="form-label text-light small fw-semibold">Parking Lot Name</label>
                    <input type="text" name="name" class="form-control bg-dark text-white border-secondary" placeholder="e.g., IIT Madras Tech Garage" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-light small fw-semibold">Location / Address</label>
                    <input type="text" name="address" class="form-control bg-dark text-white border-secondary" placeholder="e.g., Sardar Patel Road, Guindy, Chennai" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label text-light small fw-semibold">PIN Code</label>
                        <input type="text" name="pin_code" class="form-control bg-dark text-white border-secondary" placeholder="e.g., 600036" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label text-light small fw-semibold">Total Spots</label>
                        <input type="number" name="total_spots" min="1" max="100" value="10" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-light small fw-semibold">Price Per Hour (₹)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-secondary">₹</span>
                        <input type="number" step="0.5" name="price_per_hour" value="50.0" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient-primary w-100 py-2">
                    <i class="fa-solid fa-check me-2"></i> Create Parking Lot
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
